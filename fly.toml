app = "software-negocios-"
primary_region = "iad"

[build]
  dockerfile = "fly.Dockerfile"

[deploy]
  # Release command for migrations and preparation
  release_command = "bundle exec rails db:migrate"

[env]
  PORT = "3000"
  RAILS_ENV = "production"
  RAILS_SERVE_STATIC_FILES = "true"
  RAILS_LOG_TO_STDOUT = "true"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  internal_port = 3000
  processes = ["app"]
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s" # Increased grace period for Chatwoot startup
    method = "get"
    path = "/health"
    protocol = "http"
    restart_limit = 0

[processes]
  app = "bundle exec rails db:prepare && bundle exec rails ip_lookup:setup && bundle exec rails server -b 0.0.0.0 -p 3000"
  worker = "bundle exec rails ip_lookup:setup && bundle exec sidekiq -C config/sidekiq.yml"
