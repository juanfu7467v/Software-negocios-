app = "software-negocios-"
primary_region = "iad"

[build]
  dockerfile = "fly.Dockerfile"

[deploy]
  release_command = "POSTGRES_STATEMENT_TIMEOUT=600s bundle exec rails db:chatwoot_prepare && echo $SOURCE_VERSION > .git_sha"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  internal_port = 3000
  processes = ["app"]
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0

[processes]
  app = "bundle exec rails ip_lookup:setup && bin/rails server -p $PORT -e $RAILS_ENV"
  worker = "bundle exec rails ip_lookup:setup && bundle exec sidekiq -C config/sidekiq.yml"
